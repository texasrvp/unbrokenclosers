[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://calendly.com https://cal.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "https://www.unbrokenclosers.com/*"
  to = "https://unbrokenclosers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/workshop"
  to = "/workshop.html"
  status = 301

[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 301

[[redirects]]
  from = "/tracker"
  to = "/daily-tracker.html"
  status = 301

[[redirects]]
  from = "/quiz"
  to = "/objection-quiz.html"
  status = 301

[[redirects]]
  from = "/card"
  to = "/objection-card.html"
  status = 301

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 301

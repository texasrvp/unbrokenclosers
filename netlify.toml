[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "https://www.unbrokenclosers.com/*"
  to = "https://unbrokenclosers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/workshop"
  to = "/book.html?session=workshop"
  status = 302

[[redirects]]
  from = "/quiz"
  to = "/objection-quiz.html"
  status = 301

[[redirects]]
  from = "/card"
  to = "/objection-card.html"
  status = 301

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 301
